<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CN Dashboard · JLC</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="/fonts/sarabun/400.css" />
    <link rel="stylesheet" href="/fonts/sarabun/600.css" />
    <link rel="stylesheet" href="/fonts/sarabun/700.css" />
    <link rel="stylesheet" href="/fonts/inter/400.css" />
    <link rel="stylesheet" href="/fonts/inter/600.css" />
    <link rel="stylesheet" href="/fonts/inter/700.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-in">
        <div class="brand">
          <img src="jlc-logo.png" alt="JLC Group" class="logo" />
          <div>
            <h1>CN สินค้ารับคืน</h1>
            <p class="sub" id="source">กำลังโหลด…</p>
          </div>
        </div>
        <nav class="months" id="months" aria-label="เลือกเดือน"></nav>
        <button class="btn ghost" id="refresh" type="button" title="อ่านไฟล์ Excel ใหม่">↻ รีเฟรช</button>
        <button class="btn" id="export" type="button" title="สร้างไฟล์ .html ไฟล์เดียว ส่งให้คนอื่นเปิดดูได้เลย">⬇ ส่งออก HTML</button>
      </div>
    </header>

    <main class="wrap">
      <div id="banner"></div>

      <section class="kpis" id="kpis" aria-label="สรุปตามกลุ่มเกรด"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>สัดส่วนเกรด</h2>
          <span class="muted" id="gradeHint"></span>
        </div>
        <div class="gradebar" id="gradebar"></div>
        <ul class="legend" id="legend"></ul>
      </section>

      <section class="panel">
        <div class="toolbar">
          <input id="q" type="search" placeholder="ค้นหาชื่อสินค้า หรือ SKU" autocomplete="off" />
          <select id="family" aria-label="สารสกัด"></select>
          <select id="brand" aria-label="แบรนด์"></select>
          <select id="location" aria-label="Location" hidden></select>
          <select id="sort" aria-label="เรียงตาม">
            <option value="sell">ขายต่อได้มากสุด</option>
            <option value="rush">รีบระบายมากสุด</option>
            <option value="expired">หมดอายุมากสุด</option>
            <option value="total">ยอดรวมมากสุด</option>
            <option value="name">ชื่อสินค้า ก–ฮ</option>
          </select>
          <div class="seg" role="group" aria-label="มุมมอง">
            <button type="button" data-view="cards" class="on">การ์ด</button>
            <button type="button" data-view="table">ตาราง</button>
            <button type="button" data-view="family">สารสกัด</button>
          </div>
        </div>
        <p class="filterline" id="filterline"></p>
        <div id="list"></div>
      </section>

      <section class="panel">
        <details id="codesBox">
          <summary><h2>เทียบรหัส Excel → รหัสที่ใช้</h2> <span class="pill" id="codeCount">0</span> <span class="muted">รหัสที่พิมพ์ในไฟล์ไม่ตรงกับรหัสสินค้าที่แดชบอร์ดนับให้</span></summary>
          <div id="codes"></div>
        </details>
      </section>

      <section class="panel">
        <details id="issuesBox">
          <summary><h2>ตรวจข้อมูล</h2> <span class="pill" id="issueCount">0</span> <span class="muted">แถวในไฟล์ Excel ที่ควรแก้หรือยืนยัน</span></summary>
          <div id="issues"></div>
        </details>
      </section>

      <footer class="foot muted" id="foot"></footer>
    </main>

    <dialog id="detail" aria-labelledby="dTitle"></dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
